name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: dotnet
          release-please-config: .release-please-config.json
          package-name: "."
          changelog-path: CHANGELOG.md
          draft: false
          prerelease: false

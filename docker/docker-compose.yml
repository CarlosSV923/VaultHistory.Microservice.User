name: vault-history-user

services:
  user-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vaulthistory-user-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=vault_history;Username=admin;Password=admin123
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: vaulthistory-user-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vault_history
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vault_history"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
